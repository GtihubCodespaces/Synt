[package]
name = "synt"
version = "0.1.0"
description = "Synt — a red cube with white eyes in a Dynamic Island"
authors = ["Syntax"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "synt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
